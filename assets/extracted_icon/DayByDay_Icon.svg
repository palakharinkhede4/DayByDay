<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Obsidian Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1224" />
      <stop offset="50%" stop-color="#060A14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Ambient Glow Aura: Sunset Orange & Crimson Bloom -->
    <radialGradient id="ambientAura" cx="50%" cy="52%" r="58%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#E11D48" stop-opacity="0.22" />
      <stop offset="80%" stop-color="#060A14" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#060A14" stop-opacity="0" />
    </radialGradient>

    <!-- Core Flame Glow Filter -->
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Outer Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FB7185" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FF453A" stop-opacity="1" />
    </linearGradient>

    <!-- Flame Outline Stroke Gradient: Pure Warm Radiance -->
    <linearGradient id="flameStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDBA74" />
      <stop offset="60%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Flame Body Inner Fill Gradient -->
    <linearGradient id="flameFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEDD5" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#F97316" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0.08" />
    </linearGradient>

    <!-- Flame Inner Heart Ember Gradient -->
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FED7AA" />
      <stop offset="80%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
  </defs>

  <!-- 1. Background Surface (Rounded Squircle) -->
  <rect width="512" height="512" rx="114" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="112" fill="none" stroke="rgba(249, 115, 22, 0.16)" stroke-width="2" />

  <!-- 2. Ambient Flame Aura -->
  <circle cx="256" cy="260" r="190" fill="url(#ambientAura)" />

  <!-- 3. Concentric Orbit Rings (Momentum & Daily Streak) -->
  <!-- Outer Subtle Dashed Ring -->
  <circle
    cx="256"
    cy="256"
    r="200"
    fill="none"
    stroke="rgba(249, 115, 22, 0.18)"
    stroke-width="3"
    stroke-dasharray="8 12"
  />

  <!-- Glowing Momentum Progress Ring Arc -->
  <path
    d="M 108 348 A 176 176 0 1 1 404 348"
    fill="none"
    stroke="url(#orbitGrad)"
    stroke-width="16"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- Ring Accent Glow Node at Top-Right -->
  <circle cx="380" cy="168" r="8" fill="#FFFBEB" filter="url(#softGlow)" />
  <circle cx="380" cy="168" r="4" fill="#FFFFFF" />

  <!-- 4. SIGNATURE DAYBYDAY FLAME (Centerpiece) -->
  <g filter="url(#flameGlow)">
    <!-- Main Flame Outer Glow & Body -->
    <path
      d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"
      transform="translate(70, 54) scale(15.5)"
      fill="url(#flameFillGrad)"
      stroke="url(#flameStrokeGrad)"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner Core Flame Droplet (Glowing Ember) -->
    <path
      d="M12 7c.4 1.8 1.4 3.4 2.8 4.5 1.3 1 2 2.3 2 3.7a4.8 4.8 0 0 1-9.6 0c0-.8.3-1.6.7-2.1a1.7 1.7 0 0 0 1.7 1.7 1.7 1.7 0 0 0 1.7-1.7c0-.9-.4-1.4-.7-2.1-.7-1.4-.2-2.7 1.4-4z"
      transform="translate(70, 54) scale(15.5)"
      fill="url(#emberGrad)"
      opacity="0.88"
    />

    <!-- Inner White-Hot Highlight Spark at Core -->
    <ellipse cx="256" cy="302" rx="14" ry="22" fill="#FFFFFF" opacity="0.85" filter="url(#softGlow)" />
  </g>

  <!-- 5. Floating Momentum Sparkle Stars -->
  <!-- Left Sparkle -->
  <g transform="translate(136, 172)" filter="url(#softGlow)">
    <path d="M0 -11 L2.5 -2.5 L11 0 L2.5 2.5 L0 11 L-2.5 2.5 L-11 0 L-2.5 -2.5 Z" fill="#FDE68A" />
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
  <!-- Right Sparkle -->
  <g transform="translate(372, 296)" filter="url(#softGlow)">
    <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z" fill="#FDBA74" />
    <circle cx="0" cy="0" r="1.8" fill="#FFFFFF" />
  </g>
</svg>
