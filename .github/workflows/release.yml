name: Build & Publish DayByDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security Audit & Secret Scanner
        run: |
          echo "Scanning repository for exposed secrets and database URLs..."
          FORBIDDEN_PATTERN='(npg_[a-zA-Z0-9_-]+|postgresql:\/\/[^<@[:space:]]+:[^@[:space:]]+@[^[:space:]]+|postgres:\/\/[^<@[:space:]]+:[^@[:space:]]+@[^[:space:]]+|neondb_owner)'
          if git grep -E -I "$FORBIDDEN_PATTERN" -- ':!package-lock.json' ':!.github/workflows/*'; then
            echo "::error::SECURITY VIOLATION: Hardcoded database secret or connection string detected!"
            exit 1
          fi
          echo "Security audit passed: Clean codebase with 0 exposed secrets."

      - name: Set up Java 21 (Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Web Build Environment
        run: |
          echo "Verifying API endpoint configuration..."
          FORBIDDEN_PATTERNS='(postgres|neon\.tech|npg_|@)'
          if echo "https://day-by-day-palak-2599.vercel.app" | grep -E -i "$FORBIDDEN_PATTERNS"; then
            echo "::error::CRITICAL SECURITY VIOLATION: Invalid API URL!"
            exit 1
          fi

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_API_URL: 'https://day-by-day-palak-2599.vercel.app'

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Extract Version & Check If New Release Needed
        id: versioning
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "APP_TAG=v${VERSION}" >> $GITHUB_OUTPUT

          # Standard single release artifact
          cp android/app/build/outputs/apk/release/app-release.apk "DayByDay-v${VERSION}.apk"

      - name: Generate Release Changelog
        run: |
          VERSION="${{ steps.versioning.outputs.APP_VERSION }}"
          echo "## DayByDay v${VERSION}" > release_body.md
          echo "" >> release_body.md
          echo "### What's New:" >> release_body.md
          git log $(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD \
            --pretty=format:"* %s (%h)" >> release_body.md || \
            git log -n 15 --pretty=format:"* %s (%h)" >> release_body.md
          echo "" >> release_body.md
          echo "" >> release_body.md
          echo "### Android Installation:" >> release_body.md
          echo "1. Download \`DayByDay-v${VERSION}.apk\` below." >> release_body.md
          echo "2. Install over your existing app — all user data is preserved." >> release_body.md

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.APP_TAG }}
          name: "DayByDay v${{ steps.versioning.outputs.APP_VERSION }}"
          body_path: release_body.md
          files: DayByDay-v${{ steps.versioning.outputs.APP_VERSION }}.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          VERSION="${{ steps.versioning.outputs.APP_VERSION }}"
          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** Published / Updated DayByDay-v${VERSION}.apk to GitHub Releases" >> $GITHUB_STEP_SUMMARY
