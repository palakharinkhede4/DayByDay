name: Build & Publish DayByDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Prepare Single Unversioned APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DayByDay.apk

      - name: Purge All Deployments, Releases, and Past Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Purging All Releases and Tags ==="
          for tag in $(gh release list --json tagName -q '.[].tagName' || true); do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

          echo "=== Purging All GitHub Deployments ==="
          DEPLOYMENT_IDS=$(gh api "repos/${{ github.repository }}/deployments" --paginate --jq '.[].id' || true)
          for id in $DEPLOYMENT_IDS; do
            echo "Deactivating deployment: $id"
            gh api -X POST "repos/${{ github.repository }}/deployments/${id}/statuses" -f state=inactive || true
            echo "Deleting deployment: $id"
            gh api -X DELETE "repos/${{ github.repository }}/deployments/${id}" || true
          done

          echo "=== Purging Previous Workflow Runs ==="
          CURRENT_RUN_ID="${{ github.run_id }}"
          RUN_IDS=$(gh run list --json databaseId -q '.[].databaseId' || true)
          for rid in $RUN_IDS; do
            if [ "$rid" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting workflow run: $rid"
              gh run delete "$rid" || true
            fi
          done

      - name: Publish Single Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DayByDay (Latest Build)"
          body: |
            ## DayByDay - Latest Android Build
            
            Continuous build automatically compiled on every commit to `main`.
            
            ### Included in this build:
            * Apple ActivityKit & in-app Dynamic Island HUD.
            * Android Live Updates API and ongoing focus progress notification.
            * Real user identity, salted PBKDF2 authentication, and security questions.
            * Secret code accountability pairing.
            * Scheduled habit notifications and active day selection.
            * Consecutive streak tracking and single-row JSONB history.
            * Responsive desktop web layout and native edge-to-edge mobile app.
            * Neon PostgreSQL cloud storage optimization.
            * Light, Dark, and Auto system appearance modes.
            * Multi-layer persistent storage vault with offline resilience.
            
            ### Android Installation:
            1. Download `DayByDay.apk` attached below.
            2. Open the APK on your Android device to install.
            3. Launch DayByDay.
          files: DayByDay.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
