name: Build & Publish DayByDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Extract Version & Prepare Versioned Artifacts
        id: versioning
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "APP_TAG=v${VERSION}" >> $GITHUB_OUTPUT
          
          # Prepare both rolling DayByDay.apk and versioned DayByDay-vX.Y.Z.apk
          cp android/app/build/outputs/apk/release/app-release.apk DayByDay.apk
          cp android/app/build/outputs/apk/release/app-release.apk "DayByDay-v${VERSION}.apk"

      - name: Generate Release Changelog
        run: |
          VERSION="${{ steps.versioning.outputs.APP_VERSION }}"
          echo "## DayByDay v${VERSION} Release" > release_body.md
          echo "" >> release_body.md
          echo "### Highlights in this Build:" >> release_body.md
          echo "* **Executive Dark Sapphire Blue Palette**: App and launcher icon upgraded with dark sapphire and glowing 24k gold trophy." >> release_body.md
          echo "* **Interactive Progress Bar Touch Scrubbing**: Directly tap or drag along progress bars to instantly set workout minutes, steps, or reading." >> release_body.md
          echo "* **Intuitive Long-Press Drag & Drop Reordering**: Cleanly reorder habits by holding and dragging cards." >> release_body.md
          echo "* **Group Pod Persistence Fix**: Group pods are now securely preserved in the dual-layer IndexedDB vault across app updates." >> release_body.md
          echo "* **Delete Custom Habit Categories**: Easily delete custom categories with automatic habit migration." >> release_body.md
          echo "* **Avatar Action Sheet Modal**: Tapping profile avatar gives options to upload/change photo, remove photo, or cancel." >> release_body.md
          echo "* **Responsive Track A Friend**: Fixed mobile layout to ensure buttons remain perfectly within card bounds." >> release_body.md
          echo "* **Enhanced Hardware Haptics & Audio**: Integrated Capacitor Haptics and calibrated Web Audio synthesis." >> release_body.md
          echo "* **Smooth Habit Loading**: Progress bars and completion rings smoothly animate into view." >> release_body.md
          echo "" >> release_body.md
          echo "### Recent Commits:" >> release_body.md
          git log -n 12 --pretty=format:"* %s (%h)" >> release_body.md
          echo "" >> release_body.md
          echo "" >> release_body.md
          echo "### Android Installation:" >> release_body.md
          echo "1. Download \`DayByDay.apk\` (or \`DayByDay-v${VERSION}.apk\`) below." >> release_body.md
          echo "2. Install over your existing app (in-place update certificate preserved; user data maintained)." >> release_body.md

      - name: Publish Versioned Release (Preserved Permanently)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.APP_TAG }}
          name: "DayByDay v${{ steps.versioning.outputs.APP_VERSION }}"
          body_path: release_body.md
          files: |
            DayByDay.apk
            DayByDay-v${{ steps.versioning.outputs.APP_VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Rolling Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DayByDay v${{ steps.versioning.outputs.APP_VERSION }} (Latest Build)"
          body_path: release_body.md
          files: DayByDay.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
