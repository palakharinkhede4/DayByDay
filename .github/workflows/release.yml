name: Build & Publish DayByDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  deployments: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Android Release APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          cd ..

      - name: Prepare Single Unversioned APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk DayByDay.apk

      - name: Purge All Deployments, Releases, and Past Workflow Runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Purging All Releases and Tags ==="
          for tag in $(gh release list --json tagName -q '.[].tagName' || true); do
            echo "Deleting release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

          echo "=== Purging All GitHub Deployments ==="
          DEPLOYMENT_IDS=$(gh api "repos/${{ github.repository }}/deployments" --paginate --jq '.[].id' || true)
          for id in $DEPLOYMENT_IDS; do
            echo "Deactivating deployment: $id"
            gh api -X POST "repos/${{ github.repository }}/deployments/${id}/statuses" -f state=inactive || true
            echo "Deleting deployment: $id"
            gh api -X DELETE "repos/${{ github.repository }}/deployments/${id}" || true
          done

          echo "=== Purging Previous Workflow Runs ==="
          CURRENT_RUN_ID="${{ github.run_id }}"
          RUN_IDS=$(gh run list --json databaseId -q '.[].databaseId' || true)
          for rid in $RUN_IDS; do
            if [ "$rid" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting workflow run: $rid"
              gh run delete "$rid" || true
            fi
          done

      - name: Generate Release Changelog
        run: |
          echo "## DayByDay v1.1.0 - Latest Build" > release_body.md
          echo "" >> release_body.md
          echo "### What's New & Recent Commits:" >> release_body.md
          git log -n 12 --pretty=format:"* %s (%h)" >> release_body.md
          echo "" >> release_body.md
          echo "" >> release_body.md
          echo "### Highlights in this Build:" >> release_body.md
          echo "* Android runtime notification permissions (API 33+)." >> release_body.md
          echo "* Safe area margin fixes: zero overlap with Android status bar or iOS notch." >> release_body.md
          echo "* High-contrast bottom tab bar navigation in both Dark and Light modes." >> release_body.md
          echo "* Xiaomi / Poco HyperOS Super Island dynamic notification integration." >> release_body.md
          echo "* Habit reordering controls with up/down shifting." >> release_body.md
          echo "* Custom habit categories creation and filtering." >> release_body.md
          echo "* Custom user profile picture upload, crop, and display." >> release_body.md
          echo "* Version-based update checker with in-app changelog viewer." >> release_body.md
          echo "* Independent Sign Out vs Reset & Wipe Vault." >> release_body.md
          echo "" >> release_body.md
          echo "### Android Installation:" >> release_body.md
          echo "1. Download \`DayByDay.apk\` attached below." >> release_body.md
          echo "2. Open and install over your existing app (signing certificate preserved)." >> release_body.md
          echo "3. Launch DayByDay." >> release_body.md

      - name: Publish Single Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DayByDay v1.1.0 (Latest Build)"
          body_path: release_body.md
          files: DayByDay.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
