name: Build & Publish DayByDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Prepare Versioned APK
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          RELEASE_TAG="v${PKG_VER}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "DayByDay-${RELEASE_TAG}.apk"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Clean Existing Release For Version If Exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${RELEASE_TAG}" --yes --cleanup-tag || true

      - name: Publish Release Matching versionName Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "DayByDay ${{ env.RELEASE_TAG }} (Android APK)"
          body: |
            ## DayByDay Release ${{ env.RELEASE_TAG }}
            
            Open-source habit tracking with real-time accountability synchronization.
            
            ### Included in this build:
            * Apple ActivityKit & in-app Dynamic Island HUD.
            * Android Live Updates API and ongoing focus progress notification.
            * Real user identity, salted PBKDF2 authentication, and security questions.
            * Secret code accountability pairing.
            * Scheduled habit notifications and active day selection.
            * Consecutive streak tracking and single-row JSONB history.
            * Responsive desktop web layout and native edge-to-edge mobile app.
            * Neon PostgreSQL cloud storage optimization.
            * Light, Dark, and Auto system appearance modes.
            * Multi-layer persistent storage vault with offline resilience.
            
            ### Android Installation:
            1. Download `DayByDay-${{ env.RELEASE_TAG }}.apk` attached below.
            2. Open the APK on your Android device to install.
            3. Launch DayByDay.
          files: DayByDay-*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
