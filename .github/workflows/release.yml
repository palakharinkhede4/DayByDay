name: Build & Publish DayByDay APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 (Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Prepare Single APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk DayByDay.apk

      - name: Delete All Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(gh release list --json tagName -q '.[].tagName'); do
            echo "Deleting old release: $tag"
            gh release delete "$tag" --yes --cleanup-tag || true
          done

      - name: Publish Single Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "DayByDay (Latest Build)"
          body: |
            ## DayByDay - Latest Android Build
            
            Continuous build automatically compiled on every commit to `main`.
            
            ### Included in this build:
            * Apple ActivityKit & in-app Dynamic Island HUD.
            * Android Live Updates API and ongoing focus progress notification.
            * Real user identity, salted PBKDF2 authentication, and security questions.
            * Secret code accountability pairing.
            * Scheduled habit notifications and active day selection.
            * Consecutive streak tracking and single-row JSONB history.
            * Responsive desktop web layout and native edge-to-edge mobile app.
            * Neon PostgreSQL cloud storage optimization.
            * Light, Dark, and Auto system appearance modes.
            * Multi-layer persistent storage vault with offline resilience.
            
            ### Android Installation:
            1. Download `DayByDay.apk` attached below.
            2. Open the APK on your Android device to install.
            3. Launch DayByDay.
          files: DayByDay.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
