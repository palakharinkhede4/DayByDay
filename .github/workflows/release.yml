name: Build & Publish DayByDay APK Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Microsoft OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Sync Web Assets to Capacitor Android
        run: npx cap sync android

      - name: Build Android Debug APK with Gradle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..

      - name: Prepare APK Artifacts & Version Tag
        run: |
          if [ -n "${{ github.event.inputs.version_tag }}" ]; then
            RELEASE_TAG="${{ github.event.inputs.version_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RELEASE_TAG="${{ github.ref_name }}"
          else
            PKG_VER=$(node -p "require('./package.json').version")
            RELEASE_TAG="v${PKG_VER}"
          fi
          
          # Copy to root directory for upload
          cp android/app/build/outputs/apk/debug/app-debug.apk "DayByDay.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "DayByDay-${RELEASE_TAG}.apk"
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Upload Build Artifacts to Actions Summary
        uses: actions/upload-artifact@v4
        with:
          name: DayByDay-Android-APK
          path: |
            DayByDay.apk
            DayByDay-*.apk
          retention-days: 30

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "DayByDay ${{ env.RELEASE_TAG }} (Android APK)"
          body: |
            ## DayByDay Release ${{ env.RELEASE_TAG }}
            
            Production-grade habit tracking with real-time accountability synchronization.
            
            ### Included in this build:
            * Apple ActivityKit & in-app Dynamic Island HUD.
            * Android Live Updates API and ongoing focus progress notification.
            * Real user identity, salted PBKDF2 authentication, and security questions.
            * Secret code accountability pairing.
            * Scheduled habit notifications and active day selection.
            * Consecutive streak tracking and single-row JSONB history.
            * Responsive desktop web layout and native edge-to-edge mobile app.
            * Neon PostgreSQL cloud storage optimization.
            * Light, Dark, and Auto system appearance modes.
            * Multi-layer persistent storage vault with offline resilience.
            
            ### Android Installation:
            1. Download `DayByDay.apk` or `DayByDay-${{ env.RELEASE_TAG }}.apk` attached below.
            2. Open the APK on your Android device to install.
            3. Launch DayByDay.
          files: |
            DayByDay.apk
            DayByDay-*.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
