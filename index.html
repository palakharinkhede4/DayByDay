<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#060A14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DayByDay" />
    <meta name="description" content="DayByDay - Collaborative Habit Tracker and Shared Accountability Pods." />
    
    <!-- Industry-Leading Security & Privacy Headers -->
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' capacitor: http: https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' capacitor:; style-src 'self' 'unsafe-inline' https:; font-src 'self' https: data:; img-src 'self' data: https: blob:; connect-src 'self' capacitor: http: https: ws: wss:; object-src 'none'; base-uri 'self';" />
    
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts for Android (Roboto Flex / Outfit) and iOS (Plus Jakarta Sans / Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Roboto+Flex:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <title>DayByDay · Habit Tracker</title>
    <script>
      (function() {
        try {
          var mode = localStorage.getItem('daybyday_theme_mode') || localStorage.getItem('duotrack_theme_mode') || 'dark';
          var effective = mode;
          if (mode === 'auto' || (mode !== 'light' && mode !== 'dark')) {
            effective = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme-mode', effective);
          document.documentElement.setAttribute('data-theme-preference', mode);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
