<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Midnight Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Radial Emerald Ambient Glow -->
    <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E599" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#00C2FF" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Track Linear Gradient -->
    <linearGradient id="trackGrad" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="45%" stop-color="#00C2FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Momentum Flame Core Gradient -->
    <linearGradient id="flameGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="40%" stop-color="#FF5722" />
      <stop offset="100%" stop-color="#00E599" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- iOS / M3 App Squircle Base -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Rim -->
  <rect x="3" y="3" width="506" height="506" rx="115" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />

  <!-- Ambient Glowing Aura -->
  <circle cx="256" cy="256" r="210" fill="url(#auraGrad)" />

  <!-- Concentric Guidelines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- Dynamic Momentum Ring Track -->
  <path
    d="M 160,330 C 110,270 110,195 160,145 C 215,95 300,95 350,145 C 400,195 400,270 350,330 C 320,360 290,370 256,370"
    fill="none"
    stroke="url(#trackGrad)"
    stroke-width="26"
    stroke-linecap="round"
    filter="url(#softGlow)"
  />

  <!-- Ascending Momentum Flame -->
  <path
    d="M 256,150 C 256,150 300,205 300,250 C 300,275 280,296 256,296 C 232,296 212,275 212,250 C 212,212 242,185 256,150 Z"
    fill="url(#flameGrad)"
    filter="url(#softGlow)"
  />

  <!-- Center Pure Light Core -->
  <path
    d="M 256,215 C 256,215 274,235 274,254 C 274,264 266,272 256,272 C 246,272 238,264 238,254 C 238,240 249,230 256,215 Z"
    fill="#FFFFFF"
  />

  <!-- Progress Node Marker -->
  <circle cx="160" cy="330" r="15" fill="#00E599" filter="url(#softGlow)" />

  <!-- Orbital Streak Spark -->
  <circle cx="350" cy="145" r="10" fill="#FFD54F" filter="url(#softGlow)" />
</svg>
