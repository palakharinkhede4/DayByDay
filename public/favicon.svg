<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Midnight Sapphire Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1636" />
      <stop offset="50%" stop-color="#070E24" />
      <stop offset="100%" stop-color="#030612" />
    </linearGradient>

    <!-- Radial Ambient Aura: Electric Cyan & Sapphire -->
    <radialGradient id="ambientAura" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#2563EB" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#070E24" stop-opacity="0" />
    </radialGradient>

    <!-- Momentum Progress Ring Gradient: Cyan to Sapphire -->
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <!-- Gold Trophy Body Gradient -->
    <linearGradient id="goldTrophy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Trophy Accent / Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Trophy Base Pedestal Gradient -->
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Cyan Victory Tick Glow -->
    <filter id="tickGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star Glow -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Canvas with Subdued Border -->
  <rect x="4" y="4" width="504" height="504" rx="116" fill="url(#bgGrad)" stroke="rgba(59, 130, 246, 0.25)" stroke-width="4" />

  <!-- Ambient Glow Center -->
  <circle cx="256" cy="250" r="210" fill="url(#ambientAura)" />

  <!-- Outer Momentum Progress Track (Dotted guide) -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="18" stroke-dasharray="10 14" />

  <!-- Active Momentum Ring Arc (300 degrees progress) -->
  <circle
    cx="256"
    cy="256"
    r="182"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="18"
    stroke-linecap="round"
    stroke-dasharray="880 300"
    stroke-dashoffset="-70"
  />

  <!-- Ring Accent Pulse Node -->
  <circle cx="384" cy="128" r="9" fill="#00D2FF" filter="url(#starGlow)" />
  <circle cx="384" cy="128" r="4.5" fill="#FFFFFF" />

  <!-- ================= TROPHY EMBLEM ================= -->
  <g transform="translate(0, 10)">
    <!-- Left Trophy Handle -->
    <path
      d="M174 196 C118 196 118 268 174 278"
      fill="none"
      stroke="url(#goldTrophy)"
      stroke-width="15"
      stroke-linecap="round"
    />
    <path
      d="M174 206 C134 206 134 258 174 268"
      fill="none"
      stroke="rgba(255, 255, 255, 0.25)"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Right Trophy Handle -->
    <path
      d="M338 196 C394 196 394 268 338 278"
      fill="none"
      stroke="url(#goldTrophy)"
      stroke-width="15"
      stroke-linecap="round"
    />
    <path
      d="M338 206 C378 206 378 258 338 268"
      fill="none"
      stroke="rgba(255, 255, 255, 0.25)"
      stroke-width="3"
      stroke-linecap="round"
    />

    <!-- Trophy Stem Column -->
    <path
      d="M243 282 H269 V324 H243 Z"
      fill="url(#goldBase)"
    />

    <!-- Trophy Base Tier 1 (Neck) -->
    <rect x="233" y="322" width="46" height="10" rx="5" fill="url(#goldTrophy)" />

    <!-- Trophy Base Tier 2 (Pedestal block) -->
    <path
      d="M204 332 H308 V346 H204 Z"
      fill="url(#goldTrophy)"
    />

    <!-- Trophy Base Tier 3 (Foot) -->
    <rect x="186" y="346" width="140" height="18" rx="8" fill="url(#goldBase)" />
    <line x1="200" y1="349" x2="312" y2="349" stroke="#FFEAA7" stroke-width="2" stroke-linecap="round" opacity="0.6" />

    <!-- Trophy Main Cup Body -->
    <path
      d="M170 178 H342 C342 242 308 286 256 294 C204 286 170 242 170 178 Z"
      fill="url(#goldTrophy)"
    />

    <!-- Trophy Rim Top (Ellipse) -->
    <ellipse cx="256" cy="178" rx="86" ry="12" fill="url(#goldRim)" />
    <ellipse cx="256" cy="178" rx="76" ry="8" fill="#92400E" opacity="0.6" />

    <!-- Cup Highlight Sheen (Left side curve) -->
    <path
      d="M182 188 C182 236 208 274 246 284 C218 274 196 238 196 188 Z"
      fill="#FFFFFF"
      opacity="0.22"
    />

    <!-- ================= VICTORY TICK (CHECKMARK) ================= -->
    <!-- Tick Drop Shadow / Outer Glow -->
    <path
      d="M214 234 L244 264 L298 206"
      fill="none"
      stroke="#00D2FF"
      stroke-width="24"
      stroke-linecap="round"
      stroke-linejoin="round"
      filter="url(#tickGlow)"
    />

    <!-- Tick Crisp Electric Cyan Base -->
    <path
      d="M214 234 L244 264 L298 206"
      fill="none"
      stroke="#00D2FF"
      stroke-width="18"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Tick Core White Spark Line -->
    <path
      d="M216 234 L244 262 L296 208"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Star Milestone at Trophy Apex -->
    <path
      d="M256 138 L259 146 L267 146 L261 151 L263 159 L256 154 L249 159 L251 151 L245 146 L253 146 Z"
      fill="#FDE68A"
      filter="url(#starGlow)"
    />
  </g>
</svg>
